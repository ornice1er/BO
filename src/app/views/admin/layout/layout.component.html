<div class="admin-shell">

  <!-- ===== SIDEBAR ===== -->
  <nav class="admin-sidebar slim-scroll-container" [class.collapsed]="!menuOpen">

    <!-- Brand -->
    <div class="sidebar-brand">
      <div class="brand-icon">
        <i class="fas fa-layer-group"></i>
      </div>
      <span class="brand-text">BackOffice eService</span>
    </div>

    <!-- Navigation -->
    <ul class="sidebar-menu">
      <li *ngFor="let m of menu; let i = index" class="menu-item-wrapper">

        <!-- Titre de section -->
        <div *ngIf="m?.isTitle" class="menu-section-title">
          {{ m.title }}
        </div>

        <!-- Lien simple -->
        <a
          *ngIf="!m?.isTitle && !m?.hasChildren"
          routerLink="{{ m.link }}"
          routerLinkActive="menu-link-active"
          class="menu-link"
        >
          <i class="{{ m.icon || 'fas fa-circle' }} menu-link-icon"></i>
          <span class="menu-link-label">{{ m.title }}</span>
        </a>

        <!-- Menu déroulant -->
        <div *ngIf="!m?.isTitle && m?.hasChildren" class="menu-group">
          <a
            class="menu-link menu-link-toggle"
            [class.menu-link-active]="isMenuActive(m)"
            [class.menu-link-open]="m.expanded"
            (click)="toggleSubmenu(i, $event)"
            href="#"
          >
            <i class="{{ m.icon || 'fas fa-folder' }} menu-link-icon"></i>
            <span class="menu-link-label">{{ m.title }}</span>
            <i class="fas fa-chevron-down menu-arrow" [class.menu-arrow-open]="m.expanded"></i>
          </a>
          <ul class="submenu-list" [@slideDown]="m.expanded ? 'expanded' : 'collapsed'">
            <li *ngFor="let sub of m.children">
              <a
                class="submenu-link"
                routerLink="{{ sub.link }}"
                routerLinkActive="submenu-link-active"
              >
                <i class="{{ sub.icon || 'fas fa-angle-right' }} submenu-icon"></i>
                <span>{{ sub.title }}</span>
              </a>
            </li>
          </ul>
        </div>

      </li>
    </ul>
  </nav>

  <!-- ===== MAIN ===== -->
  <div class="admin-main">

    <!-- Header -->
    <header class="admin-header">
      <div class="header-left">
        <button class="hamburger" (click)="toggleMenu()" type="button" title="Menu">
          <i class="fas fa-bars"></i>
        </button>
        <h1 class="header-title">Backoffice</h1>
      </div>

      <div class="header-right">
        <!-- Dropdown profil -->
        <div class="dropdown">
          <button
            class="user-btn"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            <div class="user-avatar">
              {{ user?.firstname?.charAt(0) }}{{ user?.lastname?.charAt(0) }}
            </div>
            <span class="user-name">{{ user?.firstname }} {{ user?.lastname }}</span>
            <i class="fas fa-chevron-down user-chevron"></i>
          </button>
          <ul class="dropdown-menu dropdown-menu-end user-menu">
            <li class="user-menu-header">
              <div class="user-avatar user-avatar-lg">
                {{ user?.firstname?.charAt(0) }}{{ user?.lastname?.charAt(0) }}
              </div>
              <div>
                <p class="user-menu-name">{{ user?.firstname }} {{ user?.lastname }}</p>
                <p class="user-menu-role">{{ role }}</p>
              </div>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li>
              <a class="dropdown-item user-menu-item" (click)="openAddModal(profil)">
                <i class="fas fa-user-circle"></i> Mon profil
              </a>
            </li>
            <li>
              <a class="dropdown-item user-menu-item" [routerLink]="'/admin/settings'">
                <i class="fas fa-cog"></i> Paramètres
              </a>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li>
              <a class="dropdown-item user-menu-item user-menu-logout" (click)="logout()">
                <i class="fas fa-sign-out-alt"></i> Déconnexion
              </a>
            </li>
          </ul>
        </div>
      </div>
    </header>

    <!-- Page content -->
    <div class="admin-content">
      <router-outlet></router-outlet>
    </div>
  </div>

</div>


<!-- ===== MODAL PROFIL ===== -->
<ng-template #profil let-modal let-c="close" let-d="dismiss">
  <form #frmusager="ngForm" (ngSubmit)="saveUsager(frmusager.value)" novalidate>

    <div class="modal-header" style="background-color: #0A3764;">
      <h5 class="modal-title text-white">Mon profil</h5>
      <button type="button" class="btn-close btn-close-white" aria-label="Close" (click)="d('Cross click')"></button>
    </div>

    <div class="modal-body p-4">
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label fw-medium">Nom <span class="text-danger">*</span></label>
          <input type="text" class="form-control" name="lastname" [(ngModel)]="user.lastname" required>
        </div>
        <div class="col-12">
          <label class="form-label fw-medium">Prénoms <span class="text-danger">*</span></label>
          <input type="text" class="form-control" name="firstname" [(ngModel)]="user.firstname" required>
        </div>
        <div class="col-12">
          <label class="form-label fw-medium">Email <span class="text-danger">*</span></label>
          <input type="email" class="form-control" name="email" [(ngModel)]="user.email" required>
        </div>
        <div class="col-12">
          <label class="form-label fw-medium">Téléphone <span class="text-danger">*</span></label>
          <input type="text" class="form-control" name="phone" [(ngModel)]="user.phone" required>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-outline-secondary btn-sm" (click)="d('Cross click')">Annuler</button>
      <button type="submit" class="btn btn-primary btn-sm" [disabled]="frmusager.invalid || loading">
        <i class="fas fa-save me-1"></i> Enregistrer
      </button>
    </div>

  </form>
</ng-template>
