
<div class="profil-page">

  <!-- Hero card -->
  <div class="profil-hero-card">
    <div class="profil-hero-left">
      <div class="profil-avatar">{{ getInitials() }}</div>
      <div class="profil-hero-info">
        <div class="profil-hero-name">
          {{ user?.agent?.lastname || '—' }} {{ user?.agent?.firstname }}
        </div>
        <div class="profil-hero-badges">
          <span class="profil-role-badge" *ngFor="let r of user?.roles">{{ r.name }}</span>
          <span class="profil-status-badge" [class.badge--active]="user?.is_active">
            {{ user?.is_active ? 'Actif' : 'Bloqué' }}
          </span>
          <span *ngIf="user?.is_trade" class="profil-trade-badge">
            <i class="bi bi-briefcase-fill"></i> Acteur métier
          </span>
        </div>
        <div class="profil-hero-sub">
          <span *ngIf="user?.email"><i class="bi bi-envelope-fill"></i> {{ user?.email }}</span>
          <span *ngIf="user?.phone"><i class="bi bi-telephone-fill"></i> {{ user?.phone }}</span>
          <span *ngIf="user?.agent?.unite_admin">
            <i class="bi bi-building"></i> {{ user?.agent?.unite_admin?.sigle }}
          </span>
        </div>
      </div>
    </div>
    <div class="profil-hero-refresh" *ngIf="loadingUser">
      <div class="spinner-border spinner-border-sm" style="color:#1a5fa8"></div>
    </div>
  </div>

  <!-- Tabs card -->
  <div class="profil-tabs-card">
    <div class="profil-tab-nav">
      <button class="profil-tab-btn" [class.active]="activeTab === 0" (click)="activeTab = 0">
        <i class="bi bi-person-fill"></i> Informations
      </button>
      <button class="profil-tab-btn" [class.active]="activeTab === 1" (click)="activeTab = 1">
        <i class="bi bi-lock-fill"></i> Sécurité
      </button>
      <button *ngIf="user?.is_signer" class="profil-tab-btn" [class.active]="activeTab === 2" (click)="activeTab = 2">
        <i class="bi bi-pen-fill"></i> Signature
      </button>
    </div>

    <!-- Tab 0 : Informations -->
    <div class="profil-tab-body" *ngIf="activeTab === 0">
      <form #userForm="ngForm" (ngSubmit)="update(userForm.value)">
        <div class="profil-form-grid">
          <div class="profil-field">
            <label class="profil-label">Email <span class="text-danger">*</span></label>
            <input type="email" name="email" class="profil-input" required
              [(ngModel)]="user.email" placeholder="exemple@mail.com">
          </div>
          <div class="profil-field">
            <label class="profil-label">Téléphone</label>
            <input type="text" name="phone" class="profil-input"
              [(ngModel)]="user.phone" placeholder="+229 ...">
          </div>
          <div class="profil-field">
            <label class="profil-label">Date de naissance</label>
            <input type="date" name="birthdate" class="profil-input"
              [(ngModel)]="user.birthdate">
          </div>
          <div class="profil-field">
            <label class="profil-label">Lieu de naissance</label>
            <input type="text" name="birthplace" class="profil-input"
              [(ngModel)]="user.birthplace" placeholder="Ville, Pays">
          </div>
          <div class="profil-field profil-field--full">
            <label class="profil-label">Adresse</label>
            <input type="text" name="address" class="profil-input"
              [(ngModel)]="user.address" placeholder="Adresse complète">
          </div>
        </div>
        <div class="profil-form-footer">
          <button type="submit" class="profil-btn-submit" [disabled]="userForm.invalid || loading">
            <i class="bi bi-check2-circle"></i> Sauvegarder
            <app-loading [isVisible]="loading"></app-loading>
          </button>
        </div>
      </form>
    </div>

    <!-- Tab 1 : Sécurité -->
    <div class="profil-tab-body" *ngIf="activeTab === 1">
      <form #mpForm="ngForm" (ngSubmit)="changePassword(mpForm.value)">
        <div class="profil-form-grid">
          <div class="profil-field profil-field--full">
            <label class="profil-label">Ancien mot de passe <span class="text-danger">*</span></label>
            <input type="password" name="old_password" class="profil-input" required ngModel placeholder="••••••••">
          </div>
          <div class="profil-field">
            <label class="profil-label">Nouveau mot de passe <span class="text-danger">*</span></label>
            <input type="password" name="new_password" class="profil-input" required minlength="8" ngModel placeholder="Min. 8 caractères">
          </div>
          <div class="profil-field">
            <label class="profil-label">Confirmer le mot de passe <span class="text-danger">*</span></label>
            <input type="password" name="confirm_password" class="profil-input" required ngModel placeholder="Répéter">
          </div>
        </div>
        <div class="profil-form-footer">
          <button type="submit" class="profil-btn-submit profil-btn-danger" [disabled]="mpForm.invalid || loading">
            <i class="bi bi-key-fill"></i> Changer le mot de passe
            <app-loading [isVisible]="loading"></app-loading>
          </button>
        </div>
      </form>
    </div>

    <!-- Tab 2 : Signature -->
    <div class="profil-tab-body" *ngIf="user?.is_signer && activeTab === 2">
      <form #signForm="ngForm" (ngSubmit)="storeSign(signForm.value)">
        <div class="profil-signature-wrap">
          <img [src]="fileSrc" alt="Signature" class="profil-signature-img">
          <p class="profil-signature-hint">Aperçu de votre signature numérisée</p>
        </div>
        <div class="profil-field">
          <label class="profil-label">Fichier image <span class="text-danger">*</span></label>
          <input type="file" accept="image/*" (change)="loadImg($event)" class="profil-input">
        </div>
        <div class="profil-form-footer">
          <button type="submit" class="profil-btn-submit" [disabled]="loading">
            <i class="bi bi-upload"></i> Charger ma signature
            <app-loading [isVisible]="loading"></app-loading>
          </button>
        </div>
      </form>
    </div>
  </div>

</div>
