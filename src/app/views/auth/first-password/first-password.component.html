
<div class=" " style="min-height: 100vh; width: 100%;">

    <div class="container d-flex flex-column justify-content-start h-100">
        <div class="col-12 col-md-5 mx-auto align-self-center ">
        <div class="card">
            <div class="card-body">
                <h3 class="text-center">Première connexion</h3>
                <p class="text-center text-muted">
                    Pour des raisons de sécurité, vous devez définir un nouveau mot de passe avant d'accéder à l'application.
                </p>
                <form class="" #fpForm="ngForm" (ngSubmit)="changePassword(fpForm.value)">
                    <div class="form-row">
                            <div class="mb-3 form-group">
                                <label for="np1" class="">Nouveau mot de passe</label>
                                <input name="password" id="np1" placeholder="Mot de passe ici..." type="password" class="form-control" ngModel required minlength="8">
                                <small class="text-muted">8 caractères minimum.</small>
                                </div>
                        <div class="mb-3 form-group">
                        <label for="np2" class="">Confirmer mot de passe</label>
                        <input name="password_confirmation" id="np2" placeholder="Mot de passe ici..." type="password" class="form-control" ngModel required minlength="8">
                        </div>
                        </div>
                    <div class="mt-4 text-center">
                        <button class="btn btn-primary btn-lg mb-3" [disabled]="fpForm.invalid || loading" type="submit">Définir mon mot de passe <app-loading [isVisible]="loading"></app-loading></button>
                        </div>
                </form>
    </div>
</div>
</div>
</div>
</div>
